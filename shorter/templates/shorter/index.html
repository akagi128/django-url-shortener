<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 90vw;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        h1 {
            width: 100%;
            margin: 0 0 40px 0;

            font-size: 48px;
            text-align: center;
        }

        form {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        input[type="url"] {
            width: 100%;
            height: 80px;

            padding: 0 25px;

            font-size: 22px;

            border: 2px solid #ccc;
            border-radius: 12px;
            outline: none;
        }

        input[type="url"]:focus {
            border-color: #555;
        }

        button {
            width: 200px;
            height: 55px;

            font-size: 18px;
            font-weight: bold;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        .result {
            width: 100%;
            margin-top: 35px;

            text-align: center;
            font-size: 22px;
        }

        .result strong {
            display: block;
            margin-top: 12px;

            font-size: 26px;
        }
    </style>
</head>

<body>

        <div class="container">

            <h1>URL Shortener</h1>

            <form action="shorten/" method="POST">
                {% csrf_token %}

                <input
                    type="url"
                    name="url"
                    placeholder="Paste your long URL here"
                    required
                >

                <button type="submit">
                    Shorten URL
                </button>
            </form>

            {% if shorturl %}
                <div class="result">
                    Your shortened URL:
                    <strong>{{ shorturl }}</strong>
                </div>
            {% endif %}

        </div>

    </body>
